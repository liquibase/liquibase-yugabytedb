name: Liquibase Test Harness

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

jobs:
  liquibase-test-harness:
    uses: liquibase/build-logic/.github/workflows/lth-docker.yml@techops-1492-fork-pr-no-vault
    secrets: inherit


  dependabot:
    needs: liquibase-test-harness
    uses: liquibase/build-logic/.github/workflows/dependabot-automerge.yml@main
    secrets: inherit
